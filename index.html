<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Declaring both means no browser falls back to requesting /favicon.ico: SVG where supported
         (it follows the OS theme through a rule inside the file), PNG elsewhere — Safari ignores
         SVG favicons entirely. Both are generated from public/favicon.svg by tools/make-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slop-vectorizer — image to SVG vectorizer in your browser</title>
    <meta
      name="description"
      content="Free client-side image vectorizer with sub-pixel edge recovery. Convert logos, sketches, and flat art to clean SVG — entirely in your browser, nothing uploaded."
    />
    <link rel="canonical" href="https://meigo.github.io/slop-vectorizer/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="slop-vectorizer — image to SVG in your browser" />
    <meta
      property="og:description"
      content="Client-side vectorizer with sub-pixel edge recovery. Logos and sketches to clean SVG — nothing uploaded."
    />
    <meta property="og:url" content="https://meigo.github.io/slop-vectorizer/" />
    <meta property="og:image" content="https://meigo.github.io/slop-vectorizer/og.png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="315" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      const t = localStorage.getItem('theme')
      if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark')
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
