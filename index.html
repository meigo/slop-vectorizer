<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Declaring both means no browser falls back to requesting /favicon.ico: SVG where supported
         (it follows the OS theme through a rule inside the file), PNG elsewhere — Safari ignores
         SVG favicons entirely. Both are generated from public/favicon.svg by tools/make-icons.mjs. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>slop-vectorizer — image to SVG vectorizer in your browser</title>
    <meta
      name="description"
      content="Free client-side image vectorizer with sub-pixel edge recovery and per-area local levels: give a face, a hand or a dark corner its own black/white point instead of one global threshold. Logos, sketches and flat art to clean SVG — entirely in your browser, nothing uploaded."
    />
    <link rel="canonical" href="https://meigo.github.io/slop-vectorizer/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="slop-vectorizer — image to SVG in your browser" />
    <meta
      property="og:description"
      content="Sub-pixel edge recovery plus per-area local levels: adjust the trace where the drawing needs it, not once for the whole page. Nothing uploaded."
    />
    <meta property="og:url" content="https://meigo.github.io/slop-vectorizer/" />
    <meta property="og:image" content="https://meigo.github.io/slop-vectorizer/og.png" />
    <meta property="og:image:width" content="600" />
    <meta property="og:image:height" content="315" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#101013" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
